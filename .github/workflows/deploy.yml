name: Build & Deploy talentcircuit-ai to QwenCloud

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

    - name: Deploy to QwenCloud
      env:
        QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
        QWEN_WORKSPACE_ID: ${{ secrets.QWEN_WORKSPACE_ID }}
      run: |
        echo "Deployment to QwenCloud initiated"
        echo "Container image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
        # QwenCloud deployment command or script goes here
        # Example: qwen-cli deploy --image $IMAGE --env QWEN_API_KEY=$QWEN_API_KEY
